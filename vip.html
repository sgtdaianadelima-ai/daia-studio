<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Grupo VIP Dale Daia</title>
<meta name="robots" content="noindex">
<style>
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:#FBF7F2;color:#3B2A22;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;text-align:center;padding:24px;box-sizing:border-box}
  h1{font-family:Georgia,serif;font-style:italic;font-weight:400;color:#7A1F2B;font-size:30px;margin:0 0 8px}
  p{margin:0 0 20px;color:#7A6457}
  a{display:inline-block;background:#7A1F2B;color:#fff;text-decoration:none;font-weight:800;border-radius:99px;padding:14px 26px}
</style>
</head>
<body>
<main>
  <h1>Achadinhos da Daia</h1>
  <p>Abrindo o grupo VIP de ofertas no WhatsApp…</p>
  <a id="ir" href="https://chat.whatsapp.com/E6jfFnVCMfN9Byt4p1nEtm">Entrar no grupo</a>
</main>
<script>
  // Conta o clique pelo código da parceira (?r=...) e abre o grupo do WhatsApp.
  var GRUPO = document.getElementById("ir").href;
  var ROBO = "https://script.google.com/macros/s/AKfycbzdJLT5-Lwb9oKNOAcwa4nZzZ95bw21W3QWOenf8ORFQmjH2QeHviIrVaPvmxLBDsKI/exec";
  var r = (new URLSearchParams(location.search).get("r") || "direto").toLowerCase().replace(/[^a-z0-9._-]/g, "").slice(0, 40) || "direto";
  var foi = false, ir = function(){ if (!foi) { foi = true; location.replace(GRUPO); } };
  try { fetch(ROBO + "?acao=clique&r=" + encodeURIComponent(r), {mode: "no-cors", keepalive: true}).then(ir, ir); } catch (e) {}
  setTimeout(ir, 1500);
</script>
</body>
</html>
